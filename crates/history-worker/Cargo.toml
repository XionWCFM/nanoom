[workspace]

[package]
name = "nanoom-history-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
futures-util = "0.3"
js-sys = "0.3"
nanoom-prediction-core = { path = "../prediction-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
worker = { version = "0.8.5", features = ["d1"] }

[profile.release]
panic = "abort"
