name: nanoom status
description: Evaluate needs results without artifacts
inputs:
  needs: {required: true}
  affectedJob: {default: affected}
  matrixJob: {default: matrix}
  group: {default: ci}
  format: {default: text}
outputs:
  result:
    description: Canonical aggregate status result JSON
    value: ${{ steps.status.outputs.result }}
runs:
  using: composite
  steps:
    - name: Evaluate workflow status
      id: status
      shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
        AFFECTED: ${{ inputs.affectedJob }}
        MATRIX: ${{ inputs.matrixJob }}
        GROUP: ${{ inputs.group }}
        FORMAT: ${{ inputs.format }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
