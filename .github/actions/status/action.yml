name: nanoom status
description: Evaluate needs results without artifacts
inputs:
  needs: {required: true}
  affectedJob: {default: affected}
  matrixJob: {default: matrix}
  format: {default: text}
  version: {default: latest}
runs:
  using: composite
  steps:
    - name: Set up nanoom
      uses: XionWCFM/nanoom/.github/actions/_setup@main
      with:
        version: ${{ inputs.version }}
    - name: Evaluate workflow status
      shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
        AFFECTED: ${{ inputs.affectedJob }}
        MATRIX: ${{ inputs.matrixJob }}
        FORMAT: ${{ inputs.format }}
      run: |
        set -euo pipefail
        trap 'echo "::error title=Workflow status failed::Review the status table above. Ensure needs contains the configured affectedJob and matrixJob, and that the matrix job uses if: needs.<affected>.outputs.has_change == '\''true'\''."' ERR
        jq -e . >/dev/null <<<"$NEEDS"
        a=$(jq -r --arg n "$AFFECTED" '.[$n].result' <<<"$NEEDS")
        m=$(jq -r --arg n "$MATRIX" '.[$n].result' <<<"$NEEDS")
        h=$(jq -r --arg n "$AFFECTED" '.[$n].outputs.has_change // empty' <<<"$NEEDS")
        [[ "$FORMAT" == text || "$FORMAT" == markdown ]] || { echo "::error title=Invalid status format::format must be text or markdown, got '$FORMAT'."; exit 2; }
        echo "Affected job ($AFFECTED): $a; has_change=$h"
        echo "Matrix job ($MATRIX): $m"
        {
          echo '### nanoom workflow status'
          echo
          echo '| Job | Result | Detail |'
          echo '|---|---|---|'
          echo "| $AFFECTED | $a | has_change=$h |"
          echo "| $MATRIX | $m | expected from affected result |"
        } >> "$GITHUB_STEP_SUMMARY"
        [[ "$a" == success ]] || { echo "::error title=Affected job did not succeed::$AFFECTED finished with '$a'. Open that job and fix its affected calculation."; exit 1; }
        case "$h:$m" in
          true:success) echo "::notice title=Workflow status::Changes were found and all matrix entries succeeded." ;;
          false:skipped) echo "::notice title=Workflow status::No changes were found and the matrix job was correctly skipped." ;;
          *) echo "::error title=Inconsistent workflow result::has_change=$h requires matrix=$([[ $h == true ]] && echo success || echo skipped), but $MATRIX finished with '$m'. Check the matrix job condition and failures."; exit 1 ;;
        esac
