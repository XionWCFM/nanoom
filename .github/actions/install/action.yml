name: nanoom install
description: Focused dependency installation for a matrix entry
inputs:
  matrix: {required: true}
  packageManager: {default: auto}
  cwd: {default: .}
  version: {default: latest}
outputs:
  result:
    description: Canonical focused-install result JSON
    value: ${{ steps.install.outputs.result }}
runs:
  using: composite
  steps:
    - name: Install focused dependencies
      id: install
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
        API: ${{ github.api_url }}
        SERVER: ${{ github.server_url }}
        TOKEN: ${{ github.token }}
        BINARY: ${{ env.NANOOM_LOCAL_BINARY }}
        MATRIX: ${{ inputs.matrix }}
        PM: ${{ inputs.packageManager }}
        CWD: ${{ inputs.cwd }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
