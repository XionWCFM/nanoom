name: nanoom install
description: Focused dependency installation for a matrix entry
inputs:
  plan: {description: "Original affected Plan reference used to anchor assignment-file validation", default: ''}
  assignmentFile: {description: "Validated assignment-file output from nanoom prepare for static work", default: ''}
  matrix: {description: "scheduler=http continuous agent only; static inline matrices are not accepted", default: ''}
  packageManager: {description: "Package manager override: auto, pnpm, or yarn", default: auto}
  cwd: {description: "Consumer working directory", default: .}
  version: {description: "Action ref (version tag or latest), explicit release tag, or local for repository tests", default: action}
  releaseBaseUrl: {description: "HTTPS origin hosting Nanoom release assets; use your GitHub Enterprise Server URL when it mirrors releases", default: "https://github.com"}
outputs:
  result:
    description: Canonical focused-install result JSON
    value: ${{ steps.install.outputs.result }}
runs:
  using: composite
  steps:
    - name: Set up nanoom
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        API: ${{ github.api_url }}
        RELEASE_BASE_URL: ${{ inputs.releaseBaseUrl }}
        TOKEN: ${{ github.token }}
        BINARY: ${{ env.NANOOM_LOCAL_BINARY }}
      run: bash "$GITHUB_ACTION_PATH/../_setup/setup.sh"
    - name: Install focused dependencies
      id: install
      shell: bash
      env:
        MATRIX: ${{ inputs.matrix }}
        ASSIGNMENT_FILE: ${{ inputs.assignmentFile }}
        PLAN: ${{ inputs.plan }}
        PM: ${{ inputs.packageManager }}
        CWD: ${{ inputs.cwd }}
        GITHUB_SHA: ${{ github.sha }}
        REPOSITORY: ${{ github.repository }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
