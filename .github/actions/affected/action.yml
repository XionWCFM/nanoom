name: nanoom affected
description: Calculate the authoritative flattened matrix
inputs:
  version: {default: latest}
  config: {default: nanoom.config.json}
  cwd: {default: '.'}
  base: {default: ''}
  head: {default: ''}
outputs:
  has_change:
    value: ${{ steps.out.outputs.has_change }}
  groups:
    value: ${{ steps.out.outputs.groups }}
  result:
    description: Canonical affected report including revisions, changed files, reasons, and matrices
    value: ${{ steps.out.outputs.result }}
runs:
  using: composite
  steps:
    - name: Calculate affected workspaces
      id: out
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        API: ${{ github.api_url }}
        SERVER: ${{ github.server_url }}
        TOKEN: ${{ github.token }}
        BINARY: ${{ env.NANOOM_LOCAL_BINARY }}
        CWD: ${{ inputs.cwd }}
        CONFIG: ${{ inputs.config }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        EVENT: ${{ github.event_name }}
        EVENT_BASE: ${{ github.event.before || github.base_ref || github.event.merge_group.base_sha }}
        EVENT_HEAD: ${{ github.sha }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
