name: nanoom affected
description: Calculate affected work and assignment matrices
inputs:
  version: {description: "Action ref (version tag or latest), explicit release tag, or local for repository tests", default: action}
  config: {description: "Config path relative to cwd", default: nanoom.config.json}
  cwd: {description: "Consumer working directory", default: '.'}
  base: {description: "Explicit comparison base; empty resolves from the GitHub event", default: ''}
  head: {description: "Explicit comparison head; empty resolves from the GitHub event", default: ''}
  scheduler: {description: "Timing backend: artifact (default), off, or http", default: artifact}
  timingRunner: {description: "Runner identity used for timing prediction", default: auto}
  timingEnvironment: {description: "Stable hardware identity used for timing history", default: ''}
  coordinatorUrl: {description: "HTTPS coordinator base URL for scheduler=http", default: ''}
  historyArtifactName: {description: "PredictionArtifact v3 name used for bounded assignment lookup", default: nanoom-prediction-v3}
  releaseBaseUrl: {description: "HTTPS origin hosting Nanoom release assets; use your GitHub Enterprise Server URL when it mirrors releases", default: "https://github.com"}
outputs:
  has_change: {description: "Whether any group has work", value: "${{ steps.out.outputs.has_change }}"}
  plan: {description: "Validated Plan v1 artifact reference for assignment consumers", value: "${{ steps.out.outputs.plan }}"}
  groups: {description: "Per-group assignment matrices", value: "${{ steps.out.outputs.groups }}"}
  result: {description: "Canonical affected and scheduling report", value: "${{ steps.out.outputs.result }}"}
runs:
  using: composite
  steps:
    - name: Set up nanoom
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        API: ${{ github.api_url }}
        RELEASE_BASE_URL: ${{ inputs.releaseBaseUrl }}
        TOKEN: ${{ github.token }}
        HISTORY_ARTIFACT: ${{ inputs.historyArtifactName }}
        BINARY: ${{ env.NANOOM_LOCAL_BINARY }}
      run: bash "$GITHUB_ACTION_PATH/../_setup/setup.sh"
    - name: Calculate affected assignments
      id: out
      shell: bash
      env:
        CWD: ${{ inputs.cwd }}
        CONFIG: ${{ inputs.config }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        EVENT: ${{ github.event_name }}
        EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.base_ref }}
        EVENT_HEAD: ${{ github.sha }}
        REF_NAME: ${{ github.ref_name }}
        HISTORY_REF: ${{ github.head_ref || github.ref_name }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        SCHEDULER: ${{ inputs.scheduler }}
        TIMING_RUNNER: ${{ inputs.timingRunner }}
        TIMING_ENVIRONMENT: ${{ inputs.timingEnvironment || (runner.environment == 'self-hosted' && format('{0}-{1}-{2}', runner.os, runner.arch, runner.name) || format('{0}-{1}', runner.os, runner.arch)) }}
        COORDINATOR_URL: ${{ inputs.coordinatorUrl }}
        COORDINATOR_TOKEN: ${{ env.NANOOM_COORDINATOR_TOKEN }}
        API: ${{ github.api_url }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        TOKEN: ${{ github.token }}
        HISTORY_ARTIFACT: ${{ inputs.historyArtifactName }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
    - name: Upload Plan v1
      if: steps.out.outputs.plan != ''
      uses: actions/upload-artifact@v4.6.2
      with:
        name: ${{ fromJSON(steps.out.outputs.plan).artifactName }}
        path: |
          ${{ steps.out.outputs.plan_artifact_path }}/plan-v1.json
          ${{ steps.out.outputs.plan_artifact_path }}/plan-reference.json
        retention-days: 30
        if-no-files-found: error
