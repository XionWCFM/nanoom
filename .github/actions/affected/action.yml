name: nanoom affected
description: Calculate the authoritative flattened matrix
inputs:
  version: {default: latest}
  group: {default: ''}
  config: {default: nanoom.config.json}
  cwd: {default: '.'}
  base: {default: ''}
  head: {default: ''}
outputs:
  has_change:
    value: ${{ steps.out.outputs.has_change }}
  matrix:
    value: ${{ steps.out.outputs.matrix }}
runs:
  using: composite
  steps:
    - name: Set up nanoom
      uses: XionWCFM/nanoom/.github/actions/_setup@main
      with:
        version: ${{ inputs.version }}
    - name: Calculate affected workspaces
      id: out
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
        CWD: ${{ inputs.cwd }}
        CONFIG: ${{ inputs.config }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
      run: |
        set -euo pipefail
        trap 'echo "::error title=Affected calculation failed::Review the error above. Verify cwd/config and fetch both comparison refs (checkout fetch-depth: 0 is the safest option)."' ERR
        started=$(date +%s)
        echo "::group::◆ nanoom affected"
        echo "  Resolving changed workspaces"
        args=(-C "$CWD" -c "$CONFIG" affected --json)
        [[ -n "$BASE" ]] && args+=(--base "$BASE"); [[ -n "$HEAD" ]] && args+=(--head "$HEAD")
        echo "  ✓ working directory: $CWD"
        echo "  ✓ config: $CONFIG"
        echo "  ✓ comparison: ${BASE:-event-derived} -> ${HEAD:-event-derived}"
        echo "  ✓ selection: ${GROUP:-all groups}"
        echo "  ✓ mechanism: changed files → dependency graph → group rules/tasks → matrix"
        if [[ -n "$BASE" && -n "$HEAD" ]]; then
          changed_files=$(git -C "$CWD" diff --name-only "$BASE...$HEAD")
          changed=$(awk 'NF {n++} END {print n+0}' <<<"$changed_files")
          echo "  ✓ changed files: $changed"
          if (( changed )); then
            echo "  changed paths:"
            while IFS= read -r path; do echo "    · $path"; done <<<"$changed_files"
          fi
        fi
        echo "::endgroup::"
        json=$(nanoom "${args[@]}"); has=$(jq -r .has_change <<<"$json"); echo "has_change=$has" >> "$GITHUB_OUTPUT"
        if [[ -n "$GROUP" ]]; then matrix=$(jq -c --arg g "$GROUP" '{include: [.group[$g].workspaces[] | . + {group:$g}]} ' <<<"$json")
        else matrix=$(jq -c '{include: [.group[] | .workspaces[]]}' <<<"$json"); fi
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        count=$(jq '.include | length' <<<"$matrix")
        elapsed=$(( $(date +%s) - started ))
        echo "::notice title=Affected result::has_change=$has; $count matrix entries will run (${elapsed}s)"
        echo "::group::◆ matrix plan ($count entries)"
        if (( count )); then
          jq -r '.include[] | "- \(.group) / \(.name) / \(.task)" + (if .shard then " / shard \(.shard)/\(.totalShards)" else "" end) + (if .isolate then " / isolated" else "" end)' <<<"$matrix"
        else
          echo "  ─ no workspace tasks matched; downstream matrix will be skipped"
        fi
        echo "  ✓ matrix ready (${elapsed}s)"
        echo "::endgroup::"
        {
          echo "### nanoom affected"
          echo
          echo "**Result:** \`has_change=$has\` — **$count** matrix entries"
          echo
          echo "Comparison: \`${BASE:-event-derived}\` -> \`${HEAD:-event-derived}\`; group: \`${GROUP:-all}\`."
          echo
          echo '| Group | Workspace | Task | Execution |'
          echo '|---|---|---|---|'
          jq -r '.include[] | "| \(.group) | \(.name) | \(.task) | " + (if .shard then "shard \(.shard)/\(.totalShards)" elif .isolate then "isolated" else "standard" end) + " |"' <<<"$matrix"
          (( count )) || echo '| - | - | - | no work |'
        } >> "$GITHUB_STEP_SUMMARY"
