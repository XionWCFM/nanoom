name: nanoom run
description: Run one authoritative matrix entry
inputs:
  matrix: {required: true}
  packageManager: {default: auto}
  monorepoTool: {default: auto}
  cwd: {default: .}
  version: {default: latest}
outputs:
  result:
    description: Canonical matrix-task result JSON
    value: ${{ steps.run.outputs.result }}
runs:
  using: composite
  steps:
    - name: Run matrix entry
      id: run
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
        API: ${{ github.api_url }}
        SERVER: ${{ github.server_url }}
        TOKEN: ${{ github.token }}
        BINARY: ${{ env.NANOOM_LOCAL_BINARY }}
        MATRIX: ${{ inputs.matrix }}
        PM: ${{ inputs.packageManager }}
        TOOL: ${{ inputs.monorepoTool }}
        CWD: ${{ inputs.cwd }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
