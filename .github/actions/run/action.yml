name: nanoom run
description: Run one authoritative matrix entry
inputs:
  plan: {description: "Original affected Plan reference used to anchor assignment-file validation", default: ''}
  assignmentFile: {description: "Validated assignment-file output from nanoom prepare for static work", default: ''}
  matrix: {description: "scheduler=http continuous agent only; static inline matrices are not accepted", default: ''}
  group: {description: "Affected group for a scheduler=http continuous agent", default: ''}
  packageManager: {description: "Package manager override: auto, pnpm, yarn, or npm", default: auto}
  monorepoTool: {description: "Runner override: auto, turbo, nx, pnpm, yarn, or npm", default: auto}
  scheduler: {description: "Timing backend selected by affected: artifact (default), off, or http", default: artifact}
  timingEnvironment: {description: "Stable hardware identity used for timing history", default: ''}
  cleanupCheckout: {description: "Delete cwd after the run when it is an isolated .nanoom/ checkout", default: 'false'}
  coordinatorUrl: {description: "HTTPS coordinator base URL for scheduler=http", default: ''}
  cwd: {description: "Prepared checkout path; defaults to the run/job/matrix isolated checkout when assignmentFile is set", default: ''}
  version: {description: "Action ref (version tag or latest), explicit release tag, or local for repository tests", default: action}
  releaseBaseUrl: {description: "HTTPS origin hosting Nanoom release assets; use your GitHub Enterprise Server URL when it mirrors releases", default: "https://github.com"}
outputs:
  result:
    description: Canonical matrix-task result JSON
    value: ${{ steps.final.outputs.result || steps.run.outputs.result }}
runs:
  using: composite
  steps:
    - name: Set up nanoom
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        API: ${{ github.api_url }}
        RELEASE_BASE_URL: ${{ inputs.releaseBaseUrl }}
        TOKEN: ${{ github.token }}
        BINARY: ${{ env.NANOOM_LOCAL_BINARY }}
      run: bash "$GITHUB_ACTION_PATH/../_setup/setup.sh"
    - name: Run matrix entry
      id: run
      shell: bash
      env:
        MATRIX: ${{ inputs.matrix }}
        ASSIGNMENT_FILE: ${{ inputs.assignmentFile }}
        PLAN: ${{ inputs.plan }}
        GROUP: ${{ inputs.group }}
        PM: ${{ inputs.packageManager }}
        TOOL: ${{ inputs.monorepoTool }}
        CWD: ${{ inputs.cwd }}
        SCHEDULER: ${{ inputs.scheduler }}
        ARTIFACT_VERSION: v4
        TIMING_ENVIRONMENT: ${{ inputs.timingEnvironment || (runner.environment == 'self-hosted' && format('{0}-{1}-{2}', runner.os, runner.arch, runner.name) || format('{0}-{1}', runner.os, runner.arch)) }}
        COORDINATOR_URL: ${{ inputs.coordinatorUrl }}
        COORDINATOR_TOKEN: ${{ env.NANOOM_COORDINATOR_TOKEN }}
        GITHUB_SHA: ${{ github.sha }}
        REPOSITORY: ${{ github.repository }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        MATRIX_INDEX: ${{ strategy.job-index || 0 }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
    - name: Upload successful timing sample
      if: inputs.scheduler == 'artifact' && steps.run.outcome == 'success'
      uses: actions/upload-artifact@v4.6.2
      with:
        name: ${{ steps.run.outputs.sample-name }}
        path: ${{ steps.run.outputs.sample-path }}
        retention-days: 30
        if-no-files-found: error
    - name: Record timing upload cost
      id: final
      if: inputs.scheduler == 'artifact' && steps.run.outcome == 'success'
      shell: bash
      env:
        BASE_RESULT: ${{ steps.run.outputs.result }}
        UPLOAD_STARTED: ${{ steps.run.outputs.upload-started }}
      run: echo "result=$(jq -c --argjson ms "$(( ($(date +%s) - UPLOAD_STARTED) * 1000 ))" '. + {telemetryUploadMs:$ms}' <<<"$BASE_RESULT")" >> "$GITHUB_OUTPUT"
    - name: Clean isolated checkout
      if: ${{ always() && inputs.cleanupCheckout == 'true' }}
      shell: bash
      env:
        CLEANUP_CHECKOUT: ${{ inputs.cleanupCheckout }}
        CWD: ${{ inputs.cwd || format('{0}/.nanoom/{1}/{2}/{3}/{4}', github.workspace, github.run_id, github.run_attempt, github.job, strategy.job-index || 0) }}
      run: bash "$GITHUB_ACTION_PATH/cleanup.sh"
