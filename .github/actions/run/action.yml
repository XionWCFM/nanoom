name: nanoom run
description: Run one authoritative matrix entry
inputs:
  matrix: {required: true}
  packageManager: {default: auto}
  monorepoTool: {default: auto}
  cwd: {default: .}
  version: {default: latest}
runs:
  using: composite
  steps:
    - name: Set up nanoom
      uses: XionWCFM/nanoom/.github/actions/_setup@main
      with:
        version: ${{ inputs.version }}
    - name: Run matrix entry
      shell: bash
      env:
        MATRIX: ${{ inputs.matrix }}
        PM: ${{ inputs.packageManager }}
        TOOL: ${{ inputs.monorepoTool }}
        CWD: ${{ inputs.cwd }}
      run: |
        set -euo pipefail
        trap 'echo "::error title=Matrix task failed::Review the task output above. Reproduce with the displayed nanoom command and verify the workspace script and runner selection."' ERR
        started=$(date +%s)
        e=$(jq -ce '(.include[0] // .) | select(.group and .task and .name)' <<<"$MATRIX"); group=$(jq -r .group <<<"$e"); task=$(jq -r .task <<<"$e"); name=$(jq -r .name <<<"$e"); args=(-C "$CWD" run "$group" "$task" --all --filter "$name")
        [[ -n $(jq -r '.shard // empty' <<<"$e") ]] && args+=(--shard "$(jq -r '.shard' <<<"$e")" --total-shards "$(jq -r '.totalShards' <<<"$e")"); [[ $(jq -r '.isolate // false' <<<"$e") == true ]] && args+=(--isolate)
        if [[ "$TOOL" == turbo && ! -x "$CWD/node_modules/.bin/turbo" ]]; then
          echo 'turbo is not present in the focused dependency closure; using the requested package-manager runner' >&2
          args+=(--runner "$PM")
        elif [[ "$TOOL" != auto ]]; then
          args+=(--runner "$TOOL")
        fi
        printf -v command '%q ' nanoom "${args[@]}"
        echo "::group::◆ nanoom run"
        echo "  workspace: $name"
        echo "  group/task: $group / $task"
        echo "  runner: ${TOOL}/${PM}"
        [[ -n $(jq -r '.shard // empty' <<<"$e") ]] && echo "  shard: $(jq -r '.shard' <<<"$e")/$(jq -r '.totalShards' <<<"$e")"
        [[ $(jq -r '.isolate // false' <<<"$e") == true ]] && echo "  isolation: enabled"
        echo "  command: ${command% }"
        nanoom "${args[@]}"
        elapsed=$(( $(date +%s) - started ))
        echo "  ✓ task succeeded (${elapsed}s)"
        echo "::endgroup::"
        echo "::notice title=Matrix task complete::$group / $name / $task succeeded (${elapsed}s)"
