name: nanoom history (GHES)
description: Merge timing samples with the GHES v3 artifact backend
inputs:
  scheduler: {description: "Timing backend: artifact (default), off, or http", default: artifact}
  runIds: {description: "JSON array of HTTP coordinator run IDs", default: '[]'}
  coordinatorUrl: {description: "HTTPS coordinator base URL for scheduler=http", default: ''}
  historyArtifactName: {description: "Artifact name used for merged timing history", default: nanoom-timing-history}
  version: {description: "Action ref, explicit release tag, or local for repository tests", default: action}
  releaseBaseUrl: {description: "HTTPS origin hosting Nanoom release assets", default: "https://github.com"}
outputs:
  result: {description: "Canonical history result", value: "${{ steps.final.outputs.result || steps.history.outputs.result }}"}
runs:
  using: composite
  steps:
    - name: Set up nanoom
      if: inputs.scheduler == 'artifact'
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        API: ${{ github.api_url }}
        RELEASE_BASE_URL: ${{ inputs.releaseBaseUrl }}
        TOKEN: ${{ github.token }}
        HISTORY_ARTIFACT: ${{ inputs.historyArtifactName }}
        BINARY: ${{ env.NANOOM_LOCAL_BINARY }}
      run: bash "$GITHUB_ACTION_PATH/../_setup/setup.sh"
    - name: Merge history or complete runs
      id: history
      shell: bash
      env:
        SCHEDULER: ${{ inputs.scheduler }}
        ARTIFACT_VERSION: v3
        RUN_IDS: ${{ inputs.runIds }}
        COORDINATOR_URL: ${{ inputs.coordinatorUrl }}
        COORDINATOR_TOKEN: ${{ env.NANOOM_COORDINATOR_TOKEN }}
        API: ${{ github.api_url }}
        REPOSITORY: ${{ github.repository }}
        TOKEN: ${{ github.token }}
        HISTORY_ARTIFACT: ${{ inputs.historyArtifactName }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        HISTORY_REF: ${{ github.head_ref || github.ref_name }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: bash "$GITHUB_ACTION_PATH/../history/run.sh"
    - name: Upload merged timing history
      if: inputs.scheduler == 'artifact' && steps.history.outcome == 'success'
      uses: actions/upload-artifact@v3.2.2
      with:
        name: ${{ inputs.historyArtifactName }}
        path: ${{ steps.history.outputs.history-path }}
        retention-days: 30
        if-no-files-found: error
    - name: Record history upload cost
      id: final
      if: inputs.scheduler == 'artifact' && steps.history.outcome == 'success'
      shell: bash
      env:
        BASE_RESULT: ${{ steps.history.outputs.result }}
        UPLOAD_STARTED: ${{ steps.history.outputs.upload-started }}
      run: echo "result=$(jq -c --argjson ms "$(( ($(date +%s) - UPLOAD_STARTED) * 1000 ))" '. + {uploadMs:$ms}' <<<"$BASE_RESULT")" >> "$GITHUB_OUTPUT"
