name: nanoom internal setup
description: Download, verify, and expose the nanoom release binary
inputs:
  version:
    default: latest
  repository:
    default: XionWCFM/nanoom
runs:
  using: composite
  steps:
    - name: Download and verify nanoom
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        API: ${{ github.api_url }}
        REPOSITORY: ${{ inputs.repository }}
        SERVER: ${{ github.server_url }}
        TOKEN: ${{ github.token }}
        BINARY: ${{ env.NANOOM_LOCAL_BINARY }}
      run: bash "$GITHUB_ACTION_PATH/setup.sh"
