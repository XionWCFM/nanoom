name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: tag
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          # Keep the release draft while parallel jobs upload assets. GitHub
          # makes published releases immutable, so publishing here would race
          # with the matrix uploads.
          draft: true

  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nanoom-linux-x64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: nanoom-linux-arm64.tar.gz
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: nanoom-macos-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nanoom-macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nanoom-windows-x64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tooling
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix tar.gz)
        if: runner.os != 'Windows'
        run: |
          cd "target/${{ matrix.target }}/release"
          tar czf "/tmp/${{ matrix.artifact }}" nanoom
          (cd /tmp && shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256")
          cp /tmp/${{ matrix.artifact }}* "$GITHUB_WORKSPACE/"

      - name: Package (windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/nanoom.exe" -DestinationPath "${{ matrix.artifact }}"
          $hash = (Get-FileHash "${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Out-File "${{ matrix.artifact }}.sha256" -Encoding ascii

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign release archive
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob "${{ matrix.artifact }}" \
            --bundle "${{ matrix.artifact }}.sigstore.json"

      - name: Upload artifact for release smoke test
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
            ${{ matrix.artifact }}.sigstore.json

  verify-release:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    needs: publish-assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
      - name: Verify archives, checksums, permissions, and executable payload
        run: bash scripts/release-smoke.sh release-artifacts
      - name: Verify Yarn platform package contracts
        run: bash scripts/platform-package-smoke.sh
      - name: Verify Sigstore bundles
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for bundle in release-artifacts/*.sigstore.json; do
            archive="${bundle%.sigstore.json}"
            cosign verify-blob "$archive" \
              --bundle "$bundle" \
              --certificate-oidc-issuer-regexp 'https://token.actions.githubusercontent.com' \
              --certificate-identity-regexp 'https://github.com/XionWCFM/nanoom/.github/workflows/release.yml@refs/(tags/v.*|heads/main)'
          done

  publish-assets:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Upload all assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ inputs.version || github.ref_name }}' release-assets/* --repo '${{ github.repository }}' --clobber

  publish-npm:
    name: Publish @nanoom/cli to npm
    runs-on: ubuntu-latest
    needs: publish-release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish platform packages and CLI wrapper
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/publish-all.sh

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: verify-release
    steps:
      - name: Publish verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.version || github.ref_name }}" --draft=false --repo "${{ github.repository }}"
