name: Action contract
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 100}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - name: Assert action surface
        run: bash scripts/action-contract.sh
