name: Action contract
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 100}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - name: Assert action surface
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/actions/affected/action.yml
          test -f .github/actions/install/action.yml
          test -f .github/actions/run/action.yml
          test -f .github/actions/status/action.yml
          ! rg -n 'setup-nanoom|nanoom-(affected|install|run|status)|max-parallel|upload-artifact|download-artifact' .github/actions .github/workflows/ci.yml
