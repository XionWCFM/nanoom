name: Action contract
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 100}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - name: Assert action surface
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/actions/affected/action.yml
          test -f .github/actions/install/action.yml
          test -f .github/actions/run/action.yml
          test -f .github/actions/status/action.yml
          ! grep -R -nE 'setup-nanoom|nanoom-(affected|install|run|status)|max-parallel|upload-artifact|download-artifact' .github/actions .github/workflows/ci.yml
          test "$(grep -R -l 'GITHUB_STEP_SUMMARY' .github/actions/*/action.yml | wc -l | tr -d ' ')" = 2
          test "$(grep -R -l '::error title=' .github/actions/*/action.yml | wc -l | tr -d ' ')" = 5
          test "$(grep -R -l '::notice title=' .github/actions/*/action.yml | wc -l | tr -d ' ')" = 5
          grep -q 'github.event.before' .github/actions/affected/action.yml
          grep -q 'github.base_ref' .github/actions/affected/action.yml
          grep -q 'github.event.merge_group.base_sha' .github/actions/affected/action.yml
          ! grep -qE 'PUSH_REF_NAME|PULL_REQUEST_(BASE|HEAD)_REF|MERGE_GROUP_(BASE|HEAD)_REF' .github/actions .github/workflows/ci.yml
