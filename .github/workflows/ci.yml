name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  change-review:
    name: Change omission review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Check required change evidence
        run: bash scripts/review-change.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all --all-features --verbose

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  coverage:
    name: Coverage (90% minimum, 95% target)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run coverage
        run: mkdir -p coverage && cargo llvm-cov --locked --workspace --all-features --cobertura --output-path coverage/cobertura.xml --fail-under-lines 90

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  build:
    name: Build release binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test CLI
        shell: bash
        run: ./target/${{ matrix.target }}/release/nanoom --help

  fixture-affected:
    name: Fixture affected matrix
    runs-on: ubuntu-latest
    outputs:
      has_change: ${{ steps.affected.outputs.has_change }}
      groups: ${{ steps.affected.outputs.groups }}
      result: ${{ steps.affected.outputs.result }}
    env:
      NANOOM_LOCAL_BINARY: ${{ github.workspace }}/target/release/nanoom
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: dtolnay/rust-toolchain@stable
      - name: Build local CLI
        run: cargo build --locked --release
      - name: Create Yarn Berry + Turborepo fixture
        run: bash .github/test-fixtures/setup-fixture.sh --shards --isolate --change
      - id: affected
        uses: ./.github/actions/affected
        with:
          version: local
          cwd: .fixture
          base: main
          head: HEAD
      - name: Test affected matrix contract
        env:
          GROUPS: ${{ steps.affected.outputs.groups }}
          RESULT: ${{ steps.affected.outputs.result }}
        run: bash scripts/verify-affected-report.sh

  fixture-run:
    name: Fixture ${{ matrix.name }} ${{ matrix.task }} shard-${{ matrix.shard || 0 }}
    needs: fixture-affected
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fixture-affected.outputs.groups).ci.matrix }}
    env:
      NANOOM_LOCAL_BINARY: ${{ github.workspace }}/target/release/nanoom
      FIXTURE_LOG: ${{ github.workspace }}/.fixture/result.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - name: Build local CLI
        run: cargo build --locked --release
      - name: Create Yarn Berry fixture
        run: bash .github/test-fixtures/setup-fixture.sh --shards --isolate --change
      - id: install
        uses: ./.github/actions/install
        with:
          version: local
          cwd: .fixture
          packageManager: yarn
          matrix: ${{ toJSON(matrix) }}
      - name: Verify root and workspace dependencies
        shell: bash
        run: node .fixture/verify-install.js "$(jq -r .name <<< '${{ toJSON(matrix) }}')"
      - name: Verify install result
        env:
          RESULT: ${{ steps.install.outputs.result }}
        run: jq -e '.status == "success" and .cli.scope.dependencyClosure and .cli.scope.devDependencies and .command != ""' <<< "$RESULT"
      - id: task
        uses: ./.github/actions/run
        with:
          version: local
          cwd: .fixture
          packageManager: yarn
          monorepoTool: turbo
          matrix: ${{ toJSON(matrix) }}
      - name: Verify run result
        env:
          RESULT: ${{ steps.task.outputs.result }}
        run: jq -e '.status == "success" and .cli.status == "success" and .command != "" and .reason != ""' <<< "$RESULT"

  fixture-aggregate:
    name: Fixture aggregate status
    if: always()
    needs: [fixture-affected, fixture-run]
    runs-on: ubuntu-latest
    env:
      NANOOM_LOCAL_BINARY: ${{ github.workspace }}/target/release/nanoom
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build local CLI
        run: cargo build --locked --release
      - name: Report direct matrix job result
        id: aggregate
        uses: ./.github/actions/status
        with:
          needs: ${{ toJSON(needs) }}
          affectedJob: fixture-affected
          matrixJob: fixture-run
          group: ci
          format: markdown
      - name: Verify status result
        env:
          RESULT: ${{ steps.aggregate.outputs.result }}
        run: jq -e '.status == "success" and .hasChange and .matrixResult == "success" and .reason != ""' <<< "$RESULT"
