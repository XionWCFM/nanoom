name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all --all-features --verbose

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    name: Coverage (90% minimum, 95% target)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run coverage
        run: mkdir -p coverage && cargo llvm-cov --workspace --all-features --cobertura --output-path coverage/cobertura.xml --fail-under-lines 90

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  build:
    name: Build release binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test CLI
        shell: bash
        run: ./target/${{ matrix.target }}/release/nanoom --help

  fixture-affected:
    name: Fixture affected matrix
    runs-on: ubuntu-latest
    outputs:
      has_change: ${{ steps.affected.outputs.has_change }}
      matrix: ${{ steps.affected.outputs.matrix }}
    env:
      NANOOM_LOCAL_BINARY: ${{ github.workspace }}/target/release/nanoom
      PULL_REQUEST_BASE_REF: main
      PULL_REQUEST_HEAD_REF: HEAD
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: dtolnay/rust-toolchain@stable
      - name: Build local CLI
        run: cargo build --release
      - name: Create Yarn Berry + Turborepo fixture
        run: bash .github/test-fixtures/setup-fixture.sh --shards --isolate --change
      - id: affected
        uses: ./.github/actions/affected
        with:
          version: local
          group: ci
          cwd: .fixture
          base: main
          head: HEAD
      - name: Assert transitive affected matrix
        env:
          MATRIX: ${{ steps.affected.outputs.matrix }}
        run: |
          echo "$MATRIX" | jq -e '[.include[].name] | sort == ["@fixture/app", "@fixture/core", "@fixture/shared", "@fixture/shared"]' >/dev/null
          echo "$MATRIX" | jq -e '[.include[] | select(.name == "@fixture/shared" and .shard == 1)] | length == 1' >/dev/null
          echo "$MATRIX" | jq -e '[.include[] | select(.name == "@fixture/shared" and .shard == 2)] | length == 1' >/dev/null
          echo "$MATRIX" | jq -e '[.include[] | select(.name == "@fixture/app" and .isolate == true)] | length == 1' >/dev/null

  fixture-run:
    name: Fixture ${{ matrix.name }} ${{ matrix.task }} shard-${{ matrix.shard || 0 }}
    needs: fixture-affected
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fixture-affected.outputs.matrix) }}
    env:
      NANOOM_LOCAL_BINARY: ${{ github.workspace }}/target/release/nanoom
      PULL_REQUEST_BASE_REF: main
      PULL_REQUEST_HEAD_REF: HEAD
      FIXTURE_LOG: ${{ github.workspace }}/.fixture/result.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - name: Build local CLI
        run: cargo build --release
      - name: Create Yarn Berry fixture
        run: bash .github/test-fixtures/setup-fixture.sh --shards --isolate --change
      - uses: ./.github/actions/install
        with:
          version: local
          cwd: .fixture
          packageManager: yarn
          matrix: ${{ toJSON(matrix) }}
      - name: Verify root and workspace dependencies
        shell: bash
        run: node .fixture/verify-install.js "$(jq -r .name <<< '${{ toJSON(matrix) }}')"
      - uses: ./.github/actions/run
        with:
          version: local
          cwd: .fixture
          packageManager: yarn
          monorepoTool: turbo
          matrix: ${{ toJSON(matrix) }}

  fixture-aggregate:
    name: Fixture aggregate status
    if: always()
    needs: [fixture-affected, fixture-run]
    runs-on: ubuntu-latest
    env:
      NANOOM_LOCAL_BINARY: ${{ github.workspace }}/target/release/nanoom
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build local CLI
        run: cargo build --release
      - name: Report direct matrix job result
        uses: ./.github/actions/status
        with:
          version: local
          needs: ${{ toJSON(needs) }}
          affectedJob: fixture-affected
          matrixJob: fixture-run
          format: markdown
