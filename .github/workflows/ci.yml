name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read
  actions: read

jobs:
  change-review:
    name: Change omission review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Check required change evidence
        run: bash scripts/review-change.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all --all-features --verbose

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  coverage:
    name: Coverage (96% minimum)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run coverage
        run: mkdir -p coverage && cargo llvm-cov --locked --workspace --all-features --cobertura --output-path coverage/cobertura.xml --fail-under-lines 96

      - name: Upload coverage report
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  build:
    name: Build release binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test CLI
        shell: bash
        run: ./target/${{ matrix.target }}/release/nanoom --help

  fixture-affected:
    name: Fixture affected matrix
    runs-on: ubuntu-latest
    outputs:
      has_change: ${{ steps.affected.outputs.has_change }}
      plan: ${{ steps.affected.outputs.plan }}
      groups: ${{ steps.affected.outputs.groups }}
      result: ${{ steps.affected.outputs.result }}
    env:
      NANOOM_LOCAL_BINARY: ${{ github.workspace }}/target/release/nanoom
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: dtolnay/rust-toolchain@stable
      - name: Build local CLI
        run: cargo build --locked --release
      - name: Create Yarn Berry + Turborepo fixture
        run: bash .github/test-fixtures/setup-fixture.sh --shards --distribution --change
      - id: affected
        uses: ./.github/actions/affected
        with:
          version: local
          cwd: .fixture
          base: main
          head: HEAD
          timingRunner: yarn
      - name: Download Plan v1 artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ fromJSON(steps.affected.outputs.plan).artifactName }}
          path: ${{ runner.temp }}/nanoom-plan
      - name: Test affected matrix contract
        env:
          GROUPS: ${{ steps.affected.outputs.groups }}
          RESULT: ${{ steps.affected.outputs.result }}
          PLAN_FILE: ${{ runner.temp }}/nanoom-plan/plan-v1.json
        run: bash scripts/verify-affected-report.sh "$PLAN_FILE"

  fixture-run:
    name: Fixture ${{ matrix.assignmentId }}
    needs: fixture-affected
    if: needs.fixture-affected.outputs.has_change == 'true'
    runs-on: ${{ matrix.runnerLabels || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fixture-affected.outputs.groups).ci.include }}
    env:
      NANOOM_LOCAL_BINARY: ${{ github.workspace }}/target/release/nanoom
      FIXTURE_LOG: ${{ github.workspace }}/.fixture/result.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - name: Build local CLI
        run: cargo build --locked --release
      - name: Create Yarn Berry fixture
        run: bash .github/test-fixtures/setup-fixture.sh --shards --distribution --change
      - name: Download affected Plan v1 artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ fromJSON(needs.fixture-affected.outputs.plan).artifactName }}
          path: ${{ runner.temp }}/nanoom-plan
      - name: Select this assignment
        env:
          PLAN_DIR: ${{ runner.temp }}/nanoom-plan
          ASSIGNMENT_ID: ${{ matrix.assignmentId }}
        run: |
          ./target/release/nanoom plan select \
            --input "$PLAN_DIR/plan-v1.json" \
            --reference "$PLAN_DIR/plan-reference.json" \
            --group ci \
            --assignment "$ASSIGNMENT_ID" \
            --output-dir "$RUNNER_TEMP/nanoom-assignment"
          jq -c '[.items[].name] | unique' \
            "$RUNNER_TEMP/nanoom-assignment/assignment.json" \
            > "$RUNNER_TEMP/nanoom-assignment/filters.json"
      - name: Verify root and workspace dependencies
        shell: bash
        env:
          ASSIGNMENT_FILE: ${{ runner.temp }}/nanoom-assignment/assignment.json
        run: |
          ./target/release/nanoom -C .fixture -c nanoom.config.json install \
            --package-manager yarn \
            --filter-file "$RUNNER_TEMP/nanoom-assignment/filters.json" \
            --json > "$RUNNER_TEMP/nanoom-install-result.json"
          jq -e '.status == "success" and .scope.dependencyClosure and .scope.devDependencies and .command != ""' \
            "$RUNNER_TEMP/nanoom-install-result.json"
          while IFS= read -r name; do
            node .fixture/verify-install.js "$name"
          done < <(jq -r '[.items[].name] | unique[]' "$ASSIGNMENT_FILE")
      - name: Run every planned item
        env:
          ASSIGNMENT_FILE: ${{ runner.temp }}/nanoom-assignment/assignment.json
        shell: bash
        run: |
          while IFS= read -r item; do
            group=$(jq -r '.group // "ci"' <<< "$item")
            task=$(jq -er '.task' <<< "$item")
            name=$(jq -er '.name' <<< "$item")
            args=(-C .fixture -c nanoom.config.json run "$group" "$task" --all --filter "$name" --json --runner yarn)
            shard=$(jq -r '.shard // empty' <<< "$item")
            if [[ -n "$shard" ]]; then
              args+=(--shard "$shard" --total-shards "$(jq -er '.totalShards' <<< "$item")")
            fi
            result=$(./target/release/nanoom "${args[@]}")
            jq -e --arg name "$name" \
              '.status == "success" and ([.executions[].workspace] | index($name) != null)' \
              <<< "$result"
          done < <(jq -c '.items[]' "$ASSIGNMENT_FILE")

  fixture-aggregate:
    name: Fixture aggregate status
    if: always()
    needs: [fixture-affected, fixture-run]
    runs-on: ubuntu-latest
    env:
      NANOOM_LOCAL_BINARY: ${{ github.workspace }}/target/release/nanoom
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build local CLI
        run: cargo build --locked --release
      - name: Report direct matrix job result
        id: aggregate
        uses: ./.github/actions/status
        with:
          results: |
            fixture-affected=${{ needs.fixture-affected.result }}
            fixture-run=${{ needs.fixture-run.result }}
          requiredJobs: ${{ needs.fixture-affected.outputs.has_change == 'true' && '["fixture-run"]' || '[]' }}
      - name: Verify status result
        env:
          RESULT: ${{ steps.aggregate.outputs.result }}
        run: jq -e '.status == "success" and (.jobs | length) == 2 and .reason != ""' <<< "$RESULT"
